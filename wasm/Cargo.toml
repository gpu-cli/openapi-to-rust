[package]
name = "openapi-to-rust-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WASM bindings for the openapi-to-rust playground on openapi-to-rust.dev"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openapi-to-rust = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
