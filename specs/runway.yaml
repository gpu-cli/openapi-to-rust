        ],
        "summary": "List avatars",
        "description": "List avatars for the authenticated user with cursor-based pagination.",
        "x-codeSamples": [
          {
            "lang": "TypeScript",
            "label": "Node SDK",
            "source": "// npm install --save @runwayml/sdk\nimport RunwayML from '@runwayml/sdk';\n\n// The env var RUNWAYML_API_SECRET is expected to contain your API key.\nconst client = new RunwayML();\n\nconst avatars = await client.avatars.list();\nfor await (const avatar of avatars) {\n  console.log(avatar);\n}"
          },
          {
            "lang": "Python",
            "label": "Python SDK",
            "source": "# pip install runwayml\nfrom runwayml import RunwayML\n\n# The env var RUNWAYML_API_SECRET is expected to contain your API key.\nclient = RunwayML()\n\nfor avatar in client.avatars.list():\n    print(avatar)"
          }
