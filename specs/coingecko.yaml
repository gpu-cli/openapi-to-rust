            "description": "number of OHLCV results to return, maximum 1000 \n Default value: 100",
            "schema": { "type": "integer" }
          },
          {
            "name": "currency",
            "in": "query",
            "required": false,
            "description": "return OHLCV in USD or quote token \n Default value: usd",
            "schema": { "type": "string", "enum": ["usd", "token"] }
          },
          {
            "name": "include_empty_intervals",
            "in": "query",
            "required": false,
            "description": "include empty intervals with no trade data, default: false",
            "schema": { "type": "boolean", "default": false }
          },
          {
            "name": "include_inactive_source",
            "in": "query",
            "required": false,
            "description": "include token data from inactive pools using the most recent swap, default: false",
            "schema": { "type": "boolean", "default": false }
          }
        ],
        "responses": {
          "200": {
            "description": "Get OHLCV data of a token",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OHLCV" } } }
          }
        }
      }
    },
    "/onchain/networks/{network}/pools/{pool_address}/trades": {
      "get": {
        "summary": "Past 24 Hour Trades by Pool Address",
        "tags": ["Trades"],
        "description": "This endpoint allows you to **query the last 300 trades in the past 24 hours based on the provided pool address**",
        "operationId": "pool-trades-contract-address",
        "x-mint": { "href": "/reference/pool-trades-contract-address" },
        "parameters": [
          {
            "name": "network",
            "in": "path",
            "description": "network ID \n *refers to [/networks](/reference/networks-list)",
            "required": true,
            "schema": { "type": "string", "example": "eth", "default": "eth" }
          },
          {
            "name": "pool_address",
            "in": "path",
            "description": "pool contract address",
            "required": true,
            "schema": {
              "type": "string",
              "example": "0x06da0fd433c1a5d7a4faa01111c044910a184553",
              "default": "0x06da0fd433c1a5d7a4faa01111c044910a184553"
            }
          },
          {
            "name": "trade_volume_in_usd_greater_than",
            "in": "query",
            "required": false,
            "description": "filter trades by trade volume in USD greater than this value \n Default value: 0",
            "schema": { "type": "number" }
          },
          {
            "name": "token",
            "in": "query",
            "required": false,
            "description": "return trades for token \n use this to invert the chart \n Available values: 'base', 'quote' or token address \n Default value: 'base'",
            "schema": { "type": "string", "default": "base" },
            "examples": {
              "base": { "value": "base" },
              "quote": { "value": "quote" },
              "base_token_address": { "value": "0xdac17f958d2ee523a2206206994597c13d831ec7" },
              "quote_token_address": { "value": "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2" }
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Get last 300 trades in past 24 hours from a pool",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Trades" } } }
          }
        }
      }
    },
    "/onchain/networks/{network}/tokens/{token_address}/trades": {
      "get": {
        "summary": "💼 Past 24 Hour Trades by Token Address",
        "tags": ["Trades"],
        "description": "This endpoint allows you to **query the last 300 trades in the past 24 hours, across all pools, based on the provided token contract address on a network**",
        "operationId": "token-trades-contract-address",
        "x-mint": { "href": "/reference/token-trades-contract-address" },
        "parameters": [
          {
            "name": "network",
            "in": "path",
            "description": "network ID \n *refers to [/networks](/reference/networks-list)",
            "required": true,
            "schema": { "type": "string", "example": "eth", "default": "eth" }
          },
          {
            "name": "token_address",
            "in": "path",
            "description": "token contract address",
            "required": true,
            "schema": {
              "type": "string",
              "example": "0xdac17f958d2ee523a2206206994597c13d831ec7",
              "default": "0xdac17f958d2ee523a2206206994597c13d831ec7"
            }
          },
          {
            "name": "trade_volume_in_usd_greater_than",
            "in": "query",
            "required": false,
            "description": "filter trades by trade volume in USD greater than this value \n Default value: 0",
            "schema": { "type": "number" }
          }
        ],
        "responses": {
          "200": {
            "description": "Get last 300 trades in past 24 hours from a token",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TokenTrades" } } }
          }
        }
      }
    },
    "/onchain/categories": {
      "get": {
        "summary": "💼 Categories List",
        "tags": ["Categories"],
        "description": "This endpoint allows you to **query all the supported categories on GeckoTerminal**",
        "operationId": "categories-list",
        "x-mint": { "href": "/reference/categories-list" },
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "page through results \n Default value: `1`",
            "schema": { "type": "integer" }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "sort the categories by field \n Default value: `h6_volume_percentage_desc`",
            "schema": {
              "type": "string",
              "enum": [
                "h1_volume_percentage_desc",
                "h6_volume_percentage_desc",
                "h12_volume_percentage_desc",
                "h24_tx_count_desc",
                "h24_volume_usd_desc",
                "fdv_usd_desc",
                "reserve_in_usd_desc"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Get list of supported categories",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/OnchainCategoriesList" } }
            }
          }
        }
      }
    },
    "/onchain/categories/{category_id}/pools": {
      "get": {
        "summary": "💼 Pools by Category ID",
        "tags": ["Categories"],
        "description": "This endpoint allows you to **query all the pools based on the provided category ID**",
        "operationId": "pools-category",
        "x-mint": { "href": "/reference/pools-category" },
        "parameters": [
          {
            "name": "category_id",
            "in": "path",
            "required": true,
            "description": "category ID",
            "schema": { "type": "string", "example": "pump-fun", "default": "pump-fun" }
          },
          {
            "name": "include",
            "in": "query",
            "required": false,
            "description": "attributes to include, comma-separated if more than one to include \n Available values: `base_token`, `quote_token`, `dex`, `network`. \n Example: `base_token` or `base_token,dex`",
            "schema": { "type": "string" }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "page through results \n Default value: `1`",
            "schema": { "type": "integer" }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "sort the pools by field \n Default value: `pool_created_at_desc`",
            "schema": {
              "type": "string",
              "enum": [
                "m5_trending",
                "h1_trending",
                "h6_trending",
                "h24_trending",
                "h24_tx_count_desc",
                "h24_volume_usd_desc",
                "pool_created_at_desc",
                "h24_price_change_percentage_desc"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Get pools by category ID",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/CategoriesPools" } }
            }
          }
        }
      }
    }
  },
