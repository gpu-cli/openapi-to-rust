# Honest support claims for OpenAPI 3.1 / 3.2 features.
#
# This file is the source of truth for what the README and Cargo description
# may claim. It is regenerated/diffed by `cargo test conformance` — drift
# between this file and the test results fails CI.
#
# status: supported | partial | unsupported | intentionally-skipped
# Each entry must reference at least one fixture under tests/conformance/fixtures/
# unless status = "intentionally-skipped".

spec_version = "3.2.0"
honest_claim = "OpenAPI 3.1 mostly; 3.2 typed and parsed; full codegen for 3.2-specific behaviors WIP."

