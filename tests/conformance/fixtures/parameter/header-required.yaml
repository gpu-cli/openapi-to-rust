# coverage: [objects.Parameter.in.header]
# fails_at: L3
# reason: header parameters silently dropped at codegen time
openapi: 3.1.0
info: { title: Header Param Demo, version: 1.0.0 }
paths:
  /things:
    post:
      operationId: createThing
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        "201":
          description: created
