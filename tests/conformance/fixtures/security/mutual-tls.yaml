# coverage: [objects.Security Scheme.type[mutualTLS]]
# fails_at: L3
# reason: mutualTLS is typed, but generated clients do not configure certificate identities
openapi: 3.1.0
info: { title: mTLS Demo, version: 1.0.0 }
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate authentication
security:
  - mtls: []
paths:
  /private:
    get:
      operationId: getPrivate
      responses:
        "200": { description: ok }
