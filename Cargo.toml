[package]
name = "openapi-to-rust"
version = "0.5.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["James Lal"]
license = "MIT"
description = "Generate strongly-typed Rust structs, HTTP clients, and SSE streaming clients from OpenAPI 3.1 specifications"
repository = "https://github.com/gpu-cli/openapi-to-rust"
homepage = "https://github.com/gpu-cli/openapi-to-rust"
keywords = ["openapi", "codegen", "rust", "sse", "api-client"]
categories = ["development-tools", "web-programming"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syn = { version = "2.0", features = ["parsing"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
insta = { version = "1.41", features = ["yaml"] }
url = "2.5"
toml = "0.8"
toml_edit = "0.22"
validator = { version = "0.20", features = ["derive"] }
specta = { version = "2.0.0-rc", features = ["derive"], optional = true }
heck = "0.5"

[dev-dependencies]
serde_yaml = "0.9"
insta = { version = "1.41", features = ["yaml"] }

[features]
specta = ["dep:specta"]

[[bin]]
name = "openapi-to-rust"
path = "src/bin/openapi-to-rust.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
